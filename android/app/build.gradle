plugins { id 'com.android.application' }
android {
    namespace 'cn.weiping.funddiary'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.weiping.niu'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'cn.weiping.funddiary.SmokeTest'
    }
    // Release APK is signed locally after CI. Private keys never leave the publisher's computer.
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
